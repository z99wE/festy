name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Build Production Assets
        run: npm run build
