name: CI / CD Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Test, Lint, Typecheck and Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run build

      - name: Run Security Audit
        run: npm audit --audit-level=high
