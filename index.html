          {
            "@type": "FAQPage",
            "@id": "https://festiya.com/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Festiya and how does AI event planning work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Festiya is an AI-powered event architecture and operations workspace. By inputting your occasion, guest count, location, and target budget, Festiya's reasoning engine synthesizes a full executable plan within 45 seconds—including itemized decimal-safe budgets, vendor negotiation criteria, risk mitigation buffers, and a minute-by-minute run-of-show schedule."
                }
              },
              {
                "@type": "Question",
                "name": "How does Festiya prevent unexpected budget variance and vendor overages?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Unlike static spreadsheets, Festiya enforces integer-cent financial arithmetic and automatically provisions an 8–10% contingency reserve into every plan. Its domain logic recalculates variable per-guest catering and rental items dynamically when attendee counts shift, preventing the average 22% cost overrun common in manual event planning."
                }
              },
              {
                "@type": "Question",
                "name": "How does Festiya differ from generic ChatGPT prompts or static templates?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Generic chatbots output unstructured prose without operational schemas or budget integrity. Festiya enforces strict Zod-validated data models across 7 operational event dimensions (tasks, budgets, vendors, ideas, risks, run-of-show, and client sharing), ensuring every plan is immediately actionable, auditable, and production-ready."
                }
              },
              {
                "@type": "Question",
                "name": "How does multi-tenant isolation protect corporate and private client data?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Festiya is built entirely on the Cloudflare edge stack with native Web Crypto API authentication (PBKDF2 SHA-256 password hashing and HMAC-SHA256 tokens). Every workspace operates under strict row-level tenant boundary middleware in Cloudflare D1, mathematically preventing cross-tenant access and data leakage across client accounts."
                }
              },
              {
                "@type": "Question",
                "name": "Can event planners share proposals with clients without exposing confidential vendor margins?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Festiya features cryptographically secure, tokenized client preview links with granular section permissions. Planners can selectively expose executive summaries, visual mood directions, and run-of-show schedules while keeping internal margin notes, draft vendor quotes, and budget variance logs private."
                }
              }
            ]
          }
        ]
